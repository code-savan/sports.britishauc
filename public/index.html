<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>British AUC Sport</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }
    .container { text-align: center; max-width: 480px; }
    .bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
    .line { width: 2px; height: 24px; background: #dc2626; flex-shrink: 0; }
    .tag { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.6); letter-spacing: 0.15em; text-transform: uppercase; }
    h1 { font-size: 36px; font-weight: 600; color: #fff; line-height: 1.2; margin-bottom: 16px; }
    p { font-size: 15px; color: rgba(255,255,255,0.5); line-height: 1.7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="bar">
      <span class="line"></span>
      <span class="tag">Restricted</span>
    </div>
    <h1>Access Denied</h1>
    <p>This website is currently not accessible. Please contact the administrator for more information.</p>
  </div>
</body>
</html>
